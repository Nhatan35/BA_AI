[project]
name = "medical-ba-ai-backend"
version = "0.1.0"
description = "Medical BA AI Phase 1 foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
